[package]
name = "fuzzolic-solver"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "solver-smt"
path = "src/bin/solver_smt.rs"

[[bin]]
name = "solver-fuzzy"
path = "src/bin/solver_fuzzy.rs"

[[bin]]
name = "main-solver"
path = "src/bin/main_solver.rs"

[dependencies]
# Z3 bindings for Rust - use dynamic linking to the forked Z3 provided in build.rs
z3 = { version = "0.12" }

# Command line argument parsing (replacement for getopt)
clap = { version = "4.0", features = ["derive"] }

# Hash functions (replacement for xxHash)
xxhash-rust = { version = "0.8", features = ["xxh32"] }

# Shared memory and IPC
shared_memory = "0.12"
libc = "0.2"

# Collections and utilities
indexmap = "2.0"
bitvec = "1.0"

# Async runtime for timeouts
tokio = { version = "1.0", features = ["full"] }

# Signal handling
ctrlc = "3.4"
nix = { version = "0.27", features = ["signal"] }

# Logging
log = "0.4"
env_logger = "0.10"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Random number generation
rand = "0.8"

# Serialization for shared memory structures
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"

# Memory management
once_cell = "1.19"

# Testing utilities
tempfile = "3.8"

[build-dependencies]
cc = "1.0"

[features]
default = []
fuzzy-solver = []
